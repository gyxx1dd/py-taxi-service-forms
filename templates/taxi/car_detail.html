{% extends "base.html" %}

{% block content %}
  <p>Manufacturer: ({{ car.manufacturer.name }}, {{ car.manufacturer.country }})</p>
  <h1>Drivers</h1>
  <hr>
  <ul>
  {% for driver in car.drivers.all %}
    <li>{{ driver.username }} ({{ driver.first_name }} {{ driver.last_name }})</li>
  {% endfor %}
  </ul>
  <a href="{% url 'taxi:car-update' car.id%}"><input type="submit" value="Edit car" class="btn btn-primary"></a>
  <br>
  <br>
  <a class="btn btn-danger" href="{% url 'taxi:car-delete' car.id%}">Delete</a>
{% endblock %}
